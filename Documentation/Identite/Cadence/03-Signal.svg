  <title id="titre">Walkuno — Cadence Signal</title>
  <desc id="description">Sur fond vert acide, un marcheur encre avance à grands pas. Son bras replié et sa jambe arrière se détachent en émeraude. La main en arrière se termine par un seul biseau.</desc>
