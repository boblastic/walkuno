<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Walkuno — La balade</title>
  <desc id="desc">De profil, une promeneuse à la casquette marine et à la veste vermillon avance à grands pas. Son talon avant se pose tandis que le pied arrière se déroule.</desc>
  <rect width="256" height="256" fill="#F4E8CF"/>
  <!-- The contact shadow lies below both shoes. -->
  <path fill="#E4D4B4" d="M54 209c31-2 99-3 147-2 4 0 6 1 4 2-21 4-99 6-148 3-7 0-9-2-3-3Z"/>
  <!-- Far arm swinging forward. -->
  <path fill="#B73D25" d="M132 82c8-3 15 2 19 12l9 19 16-3 4 9c-8 5-18 8-26 9-4 0-7-2-10-6l-18-25Z"/>
  <path fill="#AE6947" d="M176 111c4-2 7-1 10 1l7 5c3 2 3 4 1 5-1 1-4 0-6-1l-3-2c2 3 1 5-1 5s-4-4-7-5Z"/>
  <!-- Far leg extends behind the hip and rolls over the toes. -->
  <path fill="#354D5B" d="M106 125h26c-1 14-8 33-20 46-10 11-28 21-39 31l-12-12c10-13 21-29 32-39l8-22Z"/>
  <path fill="#CF875B" d="m63 187 12 10-6 7-12-9Z"/>
  <path fill="#FFF9E7" d="m61 190 11 9-3 4-12-10Z"/>
  <path fill="#182D36" d="m60 192 11 10c-1 3-1 5 2 7l3 1c3 0 5 2 5 4H69c-5 0-10-5-14-9l-6-5c2-5 6-8 11-8Z"/>
  <path fill="#FFFAE8" d="m49 198 12 10c3 3 6 4 10 4h10v3H69c-5 0-9-3-13-6l-9-8Z"/>
  <!-- Near leg, heel meeting the ground. -->
  <path fill="#172D37" d="M122 127c8-3 16 1 20 7l17 31c3 6 11 17 20 31l-15 8c-11-10-25-23-33-32l-25-29Z"/>
  <path fill="#D08A5F" d="m166 198 10-6 6 8-9 6Z"/>
  <path fill="#FFFBEB" d="m168 199 7-5 3 4-7 6Z"/>
  <path fill="#182D36" d="m171 203 9-7c3 0 6 3 9 3l11-1c4 0 6 2 6 5l-30 7c-2-1-5-4-5-7Z"/>
  <path fill="#FFFAE8" d="m175 207 31-7c2 1 2 3 0 4l-29 7-3-2Z"/>
  <!-- Short walking jacket, with a turned collar and clipped hem. -->
  <path fill="#E8502D" d="M112 81c6-5 10-7 17-8 8 1 14 6 16 15 2 10-2 22-5 32l2 12c-13 5-26 7-45 3 4-18 2-28 6-40 2-6 4-10 9-14Z"/>
