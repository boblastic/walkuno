  <path fill="#C04328" d="m127 112 12-3-2 11c-3 3-6 4-10 4Z"/>
  <path fill="#EC7045" d="m126 111 14-3-1 4-13 3Z"/>
  <!-- Near arm swings back, wrist and relaxed hand exposed. -->
  <path fill="#E8502D" d="M119 82c7 1 10 6 8 13-2 10-10 20-18 30l-17 14-8-7 15-22 7-18c3-6 7-10 13-10Z"/>
  <path fill="#BA714C" d="m86 130 8 8-4 6-7 5c-3 1-5 0-5-2l3-5c-2 1-3 3-5 2-1-1-1-2 1-5Z"/>
  <!-- Face, cropped curls and a peaked navy cap. -->
  <path fill="#BA714C" d="m121 57 21-6 8 5 1 7 4 7-5 2-1 5c-2 3-5 3-9 2l-3 7-14-6 3-11Z"/>
  <path fill="#182D36" d="M120 54c7-5 14-6 22-4l2 9-6 2c-1 6-3 7-7 9l-3 6-7-3c-5-6-6-12-1-19Z"/>
